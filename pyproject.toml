[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "tmm_fast"
dynamic = ["version"]
authors = [
    {name = "Alexander Luce", email = "alexander.luce@mpl.mpg.de"},
    {name = "Heribert Wankerl"},
]
description = 'tmm_fast is a lightweight package to speed up optical planar multilayer thin-film device computation.'
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "transfer-matrix method",
    "thin film",
    "multilayer optics",
    "photonics",
    "pytorch",
    "autograd",
    "reinforcement learning",
]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "torch>1.9",
    "matplotlib",
    "gymnasium",
]

[project.urls]
Homepage = "https://github.com/MLResearchAtOSRAM/tmm_fast"
Issues = "https://github.com/MLResearchAtOSRAM/tmm_fast/issues"
Publication = "https://doi.org/10.1364/JOSAA.450928"

[dependency-groups]
dev = [
    "pytest",
    "tmm",  # scalar reference implementation the tests compare against
    "nbmake",
    "ipykernel",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# render() calls plt.show(), which the Agg backend the tests use cannot honour
filterwarnings = ["ignore:FigureCanvasAgg is non-interactive"]
markers = [
    "slow: scalar reference grids and figure rendering; -m 'not slow' is the fast inner loop",
    "performance: opt-in timing tests; use --run-performance to run",
]

[tool.setuptools.packages.find]
include = ["tmm_fast*"]

[tool.setuptools.package-data]
# the tabulated refractive indices read by tmm_fast.materials.load()
"tmm_fast.materials" = ["*.txt"]

[tool.setuptools_scm]
